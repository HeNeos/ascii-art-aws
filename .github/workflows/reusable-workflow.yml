name: "Deploy ascii-art"

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_BUCKET_NAME:
        required: true
      AWS_BUCKET_KEY_NAME:
        required: true
      AWS_ROLE:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write

env:
  TF_LOG: INFO
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy_ecr:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_REPO_DOWNSIZE_MEDIA: ${{ steps.get-ecr-repository.outputs.IMAGE_REPO_DOWNSIZE_MEDIA }}
      IMAGE_REPO_DOWNSIZE_VIDEO: ${{ steps.get-ecr-repository.outputs.IMAGE_REPO_DOWNSIZE_VIDEO }}
      IMAGE_REPO_EXTRACT_AUDIO: ${{ steps.get-ecr-repository.outputs.IMAGE_REPO_EXTRACT_AUDIO }}
      IMAGE_REPO_MERGE_FRAMES: ${{ steps.get-ecr-repository.outputs.IMAGE_REPO_MERGE_FRAMES }}
      IMAGE_REPO_PROCESS_FRAMES: ${{ steps.get-ecr-repository.outputs.IMAGE_REPO_PROCESS_FRAMES }}
      FUNCTION_NAME_DOWNSIZE_MEDIA: ${{ steps.parse-config.outputs.FUNCTION_NAME_DOWNSIZE_MEDIA }}
      FUNCTION_NAME_DOWNSIZE_VIDEO: ${{ steps.parse-config.outputs.FUNCTION_NAME_DOWNSIZE_VIDEO }}
      FUNCTION_NAME_EXTRACT_AUDIO: ${{ steps.parse-config.outputs.FUNCTION_NAME_EXTRACT_AUDIO }}
      FUNCTION_NAME_MERGE_FRAMES: ${{ steps.parse-config.outputs.FUNCTION_NAME_MERGE_FRAMES }}
      FUNCTION_NAME_PROCESS_FRAMES: ${{ steps.parse-config.outputs.FUNCTION_NAME_PROCESS_FRAMES }}
      LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA: ${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}
      LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO: ${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}
      LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO: ${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}
      LAMBDA_FUNCTION_NAME_MERGE_FRAMES: ${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}
      LAMBDA_FUNCTION_NAME_PROCESS_FRAMES: ${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}
      BASE_REPO_URI: ${{ steps.deploy-ecr.outputs.BASE_REPO_URI }}
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-Terraform
          mask-aws-account-id: "false"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Parse Lambda Function Names
        id: parse-config
        run: |
          function_name_downsize_media=$(jq -r '.lambda.function_name_downsize_media' config.json)
          function_name_downsize_video=$(jq -r '.lambda.function_name_downsize_video' config.json)
          function_name_extract_audio=$(jq -r '.lambda.function_name_extract_audio' config.json)
          function_name_merge_frames=$(jq -r '.lambda.function_name_merge_frames' config.json)
          function_name_process_frames=$(jq -r '.lambda.function_name_process_frames' config.json)

          echo "FUNCTION_NAME_DOWNSIZE_MEDIA=${function_name_downsize_media}" >> $GITHUB_OUTPUT
          echo "FUNCTION_NAME_DOWNSIZE_VIDEO=${function_name_downsize_video}" >> $GITHUB_OUTPUT
          echo "FUNCTION_NAME_EXTRACT_AUDIO=${function_name_extract_audio}" >> $GITHUB_OUTPUT
          echo "FUNCTION_NAME_MERGE_FRAMES=${function_name_merge_frames}" >> $GITHUB_OUTPUT
          echo "FUNCTION_NAME_PROCESS_FRAMES=${function_name_process_frames}" >> $GITHUB_OUTPUT

          echo "LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA=${function_name_downsize_media}-${{ inputs.stage }}" >> $GITHUB_OUTPUT
          echo "LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO=${function_name_downsize_video}-${{ inputs.stage }}" >> $GITHUB_OUTPUT
          echo "LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO=${function_name_extract_audio}-${{ inputs.stage }}" >> $GITHUB_OUTPUT
          echo "LAMBDA_FUNCTION_NAME_MERGE_FRAMES=${function_name_merge_frames}-${{ inputs.stage }}" >> $GITHUB_OUTPUT
          echo "LAMBDA_FUNCTION_NAME_PROCESS_FRAMES=${function_name_process_frames}-${{ inputs.stage }}" >> $GITHUB_OUTPUT

      - name: Deploy ECR
        id: deploy-ecr
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_BUCKET_KEY_NAME: ${{ secrets.AWS_BUCKET_KEY_NAME }}
        run: |
          cd modules/ecr
          echo "BASE_REPO_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
          terraform fmt -check
          terraform init -backend-config="bucket=${AWS_BUCKET_NAME}" -backend-config="key=${{inputs.stage}}/ecr/${AWS_BUCKET_KEY_NAME}" -backend-config="region=${AWS_REGION}" -backend-config="workspace_key_prefix="
          terraform plan \
            -var="stage=${{inputs.stage}}" \
            -var="region=${{secrets.AWS_REGION}}" \
            -var="lambda_function_name_downsize_media=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}" \
            -var="lambda_function_name_downsize_video=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}" \
            -var="lambda_function_name_extract_audio=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}" \
            -var="lambda_function_name_merge_frames=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}" \
            -var="lambda_function_name_process_frames=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}" \
            -no-color

          terraform apply \
            -var="stage=${{inputs.stage}}" \
            -var="region=${{secrets.AWS_REGION}}" \
            -var="lambda_function_name_downsize_media=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}" \
            -var="lambda_function_name_downsize_video=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}" \
            -var="lambda_function_name_extract_audio=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}" \
            -var="lambda_function_name_merge_frames=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}" \
            -var="lambda_function_name_process_frames=${{ steps.parse-config.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}" \
            -auto-approve -input=false

      - name: Get ECR Repository URIs
        id: get-ecr-repository
        run: |
          cd modules/ecr
          echo "IMAGE_REPO_DOWNSIZE_MEDIA=$(terraform output -raw ecr_repo_downsize_media_url)" >> $GITHUB_OUTPUT
          echo "IMAGE_REPO_DOWNSIZE_VIDEO=$(terraform output -raw ecr_repo_downsize_video_url)" >> $GITHUB_OUTPUT
          echo "IMAGE_REPO_EXTRACT_AUDIO=$(terraform output -raw ecr_repo_extract_audio_url)" >> $GITHUB_OUTPUT
          echo "IMAGE_REPO_MERGE_FRAMES=$(terraform output -raw ecr_repo_merge_frames_url)" >> $GITHUB_OUTPUT
          echo "IMAGE_REPO_PROCESS_FRAMES=$(terraform output -raw ecr_repo_process_frames_url)" >> $GITHUB_OUTPUT

      - name: Save Outputs to Files
        run: |
          echo "${{ steps.deploy-ecr.outputs.BASE_REPO_URI }}" > base_repo_uri.txt
          echo "${{ steps.get-ecr-repository.outputs.IMAGE_REPO_DOWNSIZE_MEDIA }}" > image_repo_downsize_media.txt
          echo "${{ steps.get-ecr-repository.outputs.IMAGE_REPO_DOWNSIZE_VIDEO }}" > image_repo_downsize_video.txt
          echo "${{ steps.get-ecr-repository.outputs.IMAGE_REPO_EXTRACT_AUDIO }}" > image_repo_extract_audio.txt
          echo "${{ steps.get-ecr-repository.outputs.IMAGE_REPO_MERGE_FRAMES }}" > image_repo_merge_frames.txt
          echo "${{ steps.get-ecr-repository.outputs.IMAGE_REPO_PROCESS_FRAMES }}" > image_repo_process_frames.txt

      - name: Create R2 Secrets JSON
        run: |
          jq -n \
            --arg cf_account_id "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            --arg r2_access_key "${{ secrets.R2_ACCESS_KEY_ID }}" \
            --arg r2_secret_key "${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            '{
              cloudflare_account_id: $cf_account_id,
              r2_access_key_id: $r2_access_key,
              r2_secret_access_key: $r2_secret_key
            }' > r2_secrets.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecr-artifacts
          path: |
            base_repo_uri.txt
            image_repo_downsize_media.txt
            image_repo_downsize_video.txt
            image_repo_extract_audio.txt
            image_repo_merge_frames.txt
            image_repo_process_frames.txt
            r2_secrets.json
          retention-days: 1

  build_and_push_docker:
    name: Build and push Docker Images
    runs-on: ubuntu-24.04-arm
    needs: deploy_ecr
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use

      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-Terraform

      - name: Docker Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ecr-artifacts

      - name: Build and Push Docker Images
        run: |
          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          image_repo_downsize_media=$(cat image_repo_downsize_media.txt)
          image_repo_downsize_video=$(cat image_repo_downsize_video.txt)
          image_repo_extract_audio=$(cat image_repo_extract_audio.txt)
          image_repo_merge_frames=$(cat image_repo_merge_frames.txt)
          image_repo_process_frames=$(cat image_repo_process_frames.txt)

          declare -A function_images
          function_images=(
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_DOWNSIZE_MEDIA }}"]="$image_repo_downsize_media"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_DOWNSIZE_VIDEO }}"]="$image_repo_downsize_video"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_EXTRACT_AUDIO }}"]="$image_repo_extract_audio"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_MERGE_FRAMES }}"]="$image_repo_merge_frames"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_PROCESS_FRAMES }}"]="$image_repo_process_frames"
          )

          cd lambdas
          for function_name in "${!function_images[@]}"; do
              repo_name="${function_images[$function_name]}"
              (
                docker buildx build --platform linux/arm64 --provenance=false -t "$repo_name":latest -t "$repo_name":ascii-art --push -f "$function_name/Dockerfile" .
              ) &
          done
          wait

  deploy:
    runs-on: ubuntu-latest
    needs: deploy_ecr
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-Terraform

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ecr-artifacts

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_BUCKET_KEY_NAME: ${{ secrets.AWS_BUCKET_KEY_NAME }}
        run: terraform init -backend-config="bucket=${AWS_BUCKET_NAME}" -backend-config="key=${{inputs.stage}}/${AWS_BUCKET_KEY_NAME}" -backend-config="region=${AWS_REGION}" -backend-config="workspace_key_prefix="

      - name: Terraform Plan
        id: plan
        run: |
          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          terraform plan \
            -var="stage=${{ inputs.stage }}" \
            -var="lambda_image_downsize_media=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}" \
            -var="lambda_image_downsize_video=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}" \
            -var="lambda_image_extract_audio=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}" \
            -var="lambda_image_merge_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}" \
            -var="lambda_image_process_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}" \
            -var-file=r2_secrets.json \
            -no-color
        continue-on-error: true

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform ${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply on Dev
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && inputs.stage == 'dev'
        run: |
          max_retries=5
          retry_count=0
          retry_delay=30
          while true; do
            repository_failed=0
            for function_name in "${!function_images[@]}"; do
                repo_name="${function_images[$function_name]}"
                pushed_tag=$(aws ecr list-images --repository-name "$repo_name" --query "imageIds[?imageTag=='latest'].imageTag" --output text)
                if [ "$pushed_tag" != "latest" ]; then
                    echo "Repository $repo_name does not have the latest tag. Retrying..."
                    repository_failed=$((repository_failed + 1))
                fi
            done
            if [ $repository_failed -eq 0 ]; then
                echo "All repositories has images. Proceeding with lambda deployment."
                break
            fi
            retry_count=$((retry_count + 1))
            retry_delay=$((retry_delay * 2))
            if [ $retry_count -ge $max_retries ]; then
                echo "Failed to get images after $max_retries attempts. Exiting."
                exit 1
            fi
          done

          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          terraform apply \
            -var="stage=${{ inputs.stage }}" \
            -var="lambda_image_downsize_media=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}" \
            -var="lambda_image_downsize_video=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}" \
            -var="lambda_image_extract_audio=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}" \
            -var="lambda_image_merge_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}" \
            -var="lambda_image_process_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}" \
            -var-file=r2_secrets.json \
            -auto-approve -input=false

      - name: Terraform Apply on Prod
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.stage == 'prod'
        run: |
          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          terraform apply \
            -var="stage=${{ inputs.stage }}" \
            -var="lambda_image_downsize_media=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_MEDIA }}" \
            -var="lambda_image_downsize_video=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_DOWNSIZE_VIDEO }}" \
            -var="lambda_image_extract_audio=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_EXTRACT_AUDIO }}" \
            -var="lambda_image_merge_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_MERGE_FRAMES }}" \
            -var="lambda_image_process_frames=${ecr_repo_base_uri}/${{ needs.deploy_ecr.outputs.LAMBDA_FUNCTION_NAME_PROCESS_FRAMES }}" \
            -var-file=r2_secrets.json \
            -auto-approve -input=false

  lambda_update:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - deploy_ecr
      - build_and_push_docker
    steps:
      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-Terraform

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ecr-artifacts

      - name: ECR Login
        run: |
          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          aws ecr get-login-password \
            --region $AWS_DEFAULT_REGION |\
            docker login \
              --username AWS \
              --password-stdin "$ecr_repo_base_uri"

      - name: Update Lambda Functions
        run: |
          ecr_repo_base_uri=$(cat base_repo_uri.txt)
          image_repo_downsize_media=$(cat image_repo_downsize_media.txt)
          image_repo_downsize_video=$(cat image_repo_downsize_video.txt)
          image_repo_extract_audio=$(cat image_repo_extract_audio.txt)
          image_repo_merge_frames=$(cat image_repo_merge_frames.txt)
          image_repo_process_frames=$(cat image_repo_process_frames.txt)

          declare -A function_images
          function_images=(
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_DOWNSIZE_MEDIA }}"]="$image_repo_downsize_media"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_DOWNSIZE_VIDEO }}"]="$image_repo_downsize_video"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_EXTRACT_AUDIO }}"]="$image_repo_extract_audio"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_MERGE_FRAMES }}"]="$image_repo_merge_frames"
              ["${{ needs.deploy_ecr.outputs.FUNCTION_NAME_PROCESS_FRAMES }}"]="$image_repo_process_frames"
          )

          for function_name in "${!function_images[@]}"; do
              repo_name="${function_images[$function_name]}"
              (
                aws lambda update-function-code \
                  --function-name "$function_name-${{ inputs.stage }}" \
                  --image-uri "$repo_name":latest
              ) &
          done
          wait
